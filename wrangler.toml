## wrangler.toml
## ------------------------------------------------------------
## 「実験室」ノートの書き足し(交換ノート)機能専用のCloudflare Worker
## 設定(2026-09-13、Decision Log 0141・0142ではPages Functions前提
## だったが、実際の本番環境確認によりDecision Log 0143でWorker +
## Workers Static Assets + D1構成へ変更。Decision Log 0144で、
## named environmentの命名仕様を踏まえて構成を再修正した)。
##
## 本番の`futoing.com`はCloudflare Worker `futo-site`のCustom Domain
## であり、Cloudflare Pagesではない。このWorkerはGitHub連携の
## Workers Buildsでデプロイされている(Production: `npx wrangler
## deploy`、Preview: `npx wrangler versions upload`)。既存のWorker名
## `futo-site`・Custom Domainはそのまま使う(Pagesへの移行はしない)。
##
## Astro本体は`output: "static"`のポータブルな静的サイトのまま維持し、
## Cloudflare固有機能への依存は、この交換ノート機能の永続化・API部分
## (`worker/index.ts`)に限定している。`/api/*`以外のリクエストは
## Workers Static Assets(Astroの`dist/`)がそのまま配信する。
## `assets.run_worker_first`を`["/api/*"]`に限定しているため、
## `/api/*`以外はこのWorkerを経由せずassetsへ直接ルーティングされる
## (全リクエストをWorker経由にする`run_worker_first = true`は使わない)。
##
## 【重要: named environmentとWorker名について】
## Cloudflareの仕様では、`[env.X]`という named environment は、
## `name`を明示的に指定しない限り、実際にデプロイされるWorker名を
## `<トップレベルのname>-X`(例: `futo-site-preview`)に自動的に
## 変えてしまう(「legacy environments」と呼ばれる挙動)。これに
## 気づかず`[env.preview]`・`[env.production]`を追加すると、
## Custom Domainが付いた既存Worker`futo-site`とは別の、
## 存在しない・Custom Domainの無いWorkerを対象にしてしまう
## (`node_modules/wrangler`の`unstable_readConfig({env: "production"})`
## で実際に検証し確認した。Decision Log 0144参照)。そのため、
## 各`[env.X]`ブロックには必ず`name = "futo-site"`を明示し、
## どの環境でも同じWorker`futo-site`を対象にするようにしている。
##
## 【環境の構成(Decision Log 0144)】
## - トップレベル(env未指定) = Production。既存Worker`futo-site`と
##   完全に一致させ、D1もPRODUCTION用データベースを直接指定する。
##   Workers BuildsのProduction deploy(`npx wrangler deploy`、
##   `--env`もCLOUDFLARE_ENVも指定しない)は、この設定をそのまま使う
##   ため、Production側のCloudflareダッシュボード設定は今回
##   一切変更不要。
## - [env.production] … トップレベルと同一内容(name・D1とも)を
##   念のため明示的に複製している。仮にProduction側のビルド設定に
##   `CLOUDFLARE_ENV=production`が設定されていても(または将来
##   設定されても)、トップレベルと同じWorker・同じD1になるための
##   保険。
## - [env.preview]    … Cloudflare Workers BuildsのPreviewビルド用。
##   `name`はトップレベルと同じ`futo-site`(別Workerにしない)。
##   D1のみPreview専用データベースに差し替える。
##
## Preview用ビルドが誤ってProduction D1(トップレベル)を使わない
## ようにするには、Preview側のビルド設定で明示的に
## `CLOUDFLARE_ENV=preview`(またはデプロイコマンドに`--env preview`
## を追加)を設定する必要がある。これは省略できない、必ず行う
## Cloudflareダッシュボード側の作業(Decision Log 0144参照)。
## ------------------------------------------------------------
name = "futo-site"
main = "worker/index.ts"
compatibility_date = "2024-09-13"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

# --- トップレベル = Production(既存Worker futo-site と一致) --------
[vars]
NOTEBOOK_ENV = "production"

[[d1_databases]]
binding = "DB"
database_name = "futo-lab-notebooks-production"
database_id = "1afa0d52-675c-4aac-a417-82ed42a272f9"

# --- [env.production](トップレベルの明示的な複製。念のための保険) ----
[env.production]
name = "futo-site"
main = "worker/index.ts"
compatibility_date = "2024-09-13"

[env.production.vars]
NOTEBOOK_ENV = "production"

[env.production.assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

[[env.production.d1_databases]]
binding = "DB"
database_name = "futo-lab-notebooks-production"
database_id = "1afa0d52-675c-4aac-a417-82ed42a272f9"

# --- [env.preview](同じWorker futo-site、D1のみPreview用に差し替え) --
[env.preview]
name = "futo-site"
main = "worker/index.ts"
compatibility_date = "2024-09-13"

[env.preview.vars]
NOTEBOOK_ENV = "preview"

[env.preview.assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

[[env.preview.d1_databases]]
binding = "DB"
database_name = "futo-lab-notebooks-preview"
database_id = "cafcd1cf-9647-4b00-a2f2-c9b13ff4e9e8"
