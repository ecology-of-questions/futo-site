## wrangler.toml
## ------------------------------------------------------------
## 「実験室」ノートの書き足し(交換ノート)機能専用のCloudflare Worker
## 設定(2026-09-13、Decision Log 0141・0142ではPages Functions前提
## だったが、実際の本番環境確認によりDecision Log 0143でWorker +
## Workers Static Assets + D1構成へ変更した)。
##
## 本番の`futoing.com`はCloudflare Worker `futo-site`のCustom Domain
## であり、Cloudflare Pagesではない。このWorkerはGitHub連携の
## Workers Buildsでデプロイされている(Production: `npx wrangler
## deploy`、Preview: `npx wrangler versions upload`)。既存のWorker名
## `futo-site`・Custom Domainはそのまま使う(Pagesへの移行はしない)。
##
## Astro本体は`output: "static"`のポータブルな静的サイトのまま維持し、
## Cloudflare固有機能への依存は、この交換ノート機能の永続化・API部分
## (`worker/index.ts`)に限定している。`/api/*`以外のリクエストは
## Workers Static Assets(Astroの`dist/`)がそのまま配信する。
## `assets.run_worker_first`を`["/api/*"]`に限定しているため、
## `/api/*`以外はこのWorkerを経由せずassetsへ直接ルーティングされる
## (全リクエストをWorker経由にする`run_worker_first = true`は使わない)。
##
## D1データベースは3つに分離している(いずれもbinding名は"DB"で統一し、
## worker/index.ts側はどの環境でも`env.DB`のまま変更不要):
##   - トップレベル [[d1_databases]] … ローカル開発
##     (`wrangler dev`、`wrangler d1 execute --local`)専用。
##     CLOUDFLARE_ENVが未設定のままdeploy/versions uploadされた場合も
##     この設定が使われる(database_idはプレースホルダーのため、
##     万一Preview/Productionで環境変数の設定が漏れていても、本番D1へ
##     誤って書き込むのではなく、存在しないデータベースへのbind失敗で
##     デプロイ自体が失敗する安全側の構成にしている。Decision Log 0143
##     参照)。
##   - [env.preview]    … Cloudflare Workers BuildsのPreviewビルド用。
##   - [env.production] … Cloudflare Workers BuildsのProductionビルド用。
## Workers Builds側のデプロイコマンド(`wrangler deploy` /
## `wrangler versions upload`)は`--env`を指定していないため、
## どちらの環境を使うかは`CLOUDFLARE_ENV`環境変数で選択する必要がある
## (Cloudflareダッシュボード側でProduction/Previewそれぞれのビルド設定に
## `CLOUDFLARE_ENV=production` / `CLOUDFLARE_ENV=preview`を設定する。
## 手順はDecision Log 0143に記載)。
## ------------------------------------------------------------
name = "futo-site"
main = "worker/index.ts"
compatibility_date = "2024-09-13"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

# --- ローカル開発・CLOUDFLARE_ENV未設定時のフォールバック -------------
[[d1_databases]]
binding = "DB"
database_name = "futo-lab-notebooks"
database_id = "REPLACE_WITH_LOCAL_DEV_DATABASE_ID"

# --- Cloudflare Workers Builds: Preview環境用(CLOUDFLARE_ENV=preview) --
[env.preview]
main = "worker/index.ts"
compatibility_date = "2024-09-13"

[env.preview.assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

[[env.preview.d1_databases]]
binding = "DB"
database_name = "futo-lab-notebooks-preview"
database_id = "REPLACE_WITH_PREVIEW_DATABASE_ID"

# --- Cloudflare Workers Builds: Production環境用(CLOUDFLARE_ENV=production) --
[env.production]
main = "worker/index.ts"
compatibility_date = "2024-09-13"

[env.production.assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

[[env.production.d1_databases]]
binding = "DB"
database_name = "futo-lab-notebooks-production"
database_id = "REPLACE_WITH_PRODUCTION_DATABASE_ID"
